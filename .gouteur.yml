# Usage: https://github.com/jaynetics/gouteur/blob/main/README.md

repos:
  - uri: https://github.com/jaynetics/js_regex
    quick: true

  - uri: https://github.com/jaynetics/repper
    quick: true

  - uri: https://github.com/rubocop-hq/rubocop
    tasks: rspec --pattern "**/{,*}regexp{,*,*/**/*}_spec.rb"

  - uri: https://github.com/mbj/mutant
    subdir: ruby # mutant moved code to this subdir in 51f1a94
    tasks: rspec --pattern "**/{,*}regexp{,*,*/**/*}_spec.rb"

  - uri: https://github.com/teamcapybara/capybara
    # before: sed -i.bak "s/gem 'bundler', '< 3.0'//g" Gemfile
    tasks: rspec spec/regexp_dissassembler_spec.rb

  - uri: https://github.com/davishmcclurg/json_schemer
    before:
      # use contemporary bundler
      - sed -i.bak '/add_development_dependency "bundler"/d' json_schemer.gemspec
      # prevent a coverage failure when running a subset of all tests
      - sed -i.bak "s/SimpleCov.start/false and x/g" test/test_helper.rb
    tasks: rake test TEST=test/regex_test.rb
